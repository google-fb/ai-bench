<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QwenCat · 瀏覽器裡的貓圖摘要</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <p class="kicker">純前端 · WebGPU</p>
          <h1>Qwen3.5 0.8B 看貓</h1>
        </div>
        <div class="meta">
          <span id="device-pill" class="pill" data-testid="device-pill">檢查 WebGPU…</span>
          <span id="model-pill" class="pill" data-testid="model-pill">模型未載入</span>
        </div>
      </header>

      <section
        id="load-progress"
        class="load-progress"
        hidden
        data-testid="load-progress"
      >
        <div class="load-progress-meta">
          <strong id="load-progress-label" data-testid="load-progress-label">準備下載模型…</strong>
          <span id="load-progress-pct" class="load-progress-pct" data-testid="load-progress-pct"></span>
        </div>
        <div
          id="load-progress-bar"
          class="load-progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-labelledby="load-progress-label"
          data-testid="load-progress-bar"
        >
          <div id="load-progress-fill" class="load-progress-fill" data-testid="load-progress-fill"></div>
        </div>
        <p id="load-progress-detail" class="load-progress-detail" data-testid="load-progress-detail"></p>
        <p class="load-progress-hint" data-testid="load-progress-hint">
          首次約 600–700 MB，下載期間請不要關掉分頁。之後會用瀏覽器快取，再開會快很多。
        </p>
      </section>

      <section class="stage">
        <figure class="photo">
          <img id="cat-image" data-testid="cat-image" alt="即將載入的貓照片" />
          <figcaption id="cat-caption" data-testid="cat-caption">模型載入後才會抓第一張貓。</figcaption>
        </figure>
        <div class="controls">
          <label>
            換圖間隔
            <select id="interval">
              <option value="15000">15 秒</option>
              <option value="25000" selected>25 秒</option>
              <option value="40000">40 秒</option>
              <option value="60000">60 秒</option>
            </select>
          </label>
          <button id="refresh" type="button">立刻換一張</button>
          <p id="countdown" class="countdown">—</p>
        </div>
      </section>

      <section class="summary" aria-live="polite">
        <h2>圖片摘要</h2>
        <p id="summary-status" class="status" data-testid="summary-status">等待模型與第一張照片。</p>
        <p id="summary-text" class="summary-text" data-testid="summary-text"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
