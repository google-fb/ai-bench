<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#efe6d8" />
    <title>LLM 建築博物館 · LLM Architecture Museum</title>
    <meta
      name="description"
      content="用 Three.js 打造的 3D 博物館，逐層拆解 Transformer、Llama 3 與 DeepSeek V4.1 Flash 的模組。支援中英文與語音朗讀。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f3f32'/%3E%3Crect x='7' y='6' width='18' height='6' rx='1.5' fill='%23c4795a'/%3E%3Crect x='7' y='13' width='18' height='6' rx='1.5' fill='%23c9a24c'/%3E%3Crect x='7' y='20' width='18' height='6' rx='1.5' fill='%238b9a5b'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="app" data-locale="zh">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1 id="app-title">LLM 建築博物館</h1>
            <p id="app-subtitle" class="subtitle">走進大語言模型的內部，一層一層看懂它</p>
          </div>
        </div>
        <nav id="hall-nav" class="hall-nav" aria-label="Halls"></nav>
        <div class="top-tools">
          <button id="flow-toggle" class="chip" type="button" aria-pressed="true"></button>
          <button id="lang-toggle" class="chip chip-strong" type="button" aria-label="Switch language"></button>
        </div>
      </header>

      <div class="stage">
        <div id="viewport" class="viewport" aria-label="3D museum"></div>
        <div id="loading" class="loading" role="status">
          <div class="loading-card"><span class="spinner"></span><span id="loading-text">正在布置展廳…</span></div>
        </div>
        <p id="hint" class="hint"></p>

        <aside id="panel" class="panel" aria-live="polite">
          <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="true"></button>
          <div id="panel-scroll" class="panel-scroll">
            <section id="module-detail" class="module-detail"></section>
            <section id="model-card" class="model-card"></section>
            <section id="module-list" class="module-list"></section>
            <section id="legend" class="legend"></section>
            <section id="sources" class="sources"></section>
          </div>
        </aside>

        <div id="dock" class="dock">
          <div class="dock-group speech-group">
            <span id="speech-title" class="dock-label"></span>
            <button id="speech-play" class="dock-btn dock-btn-primary" type="button"></button>
            <button id="speech-pause" class="dock-btn" type="button"></button>
            <button id="speech-stop" class="dock-btn" type="button"></button>
            <label class="rate">
              <span id="rate-label"></span>
              <input id="rate-slider" type="range" min="0.5" max="2" step="0.1" value="1" />
              <output id="rate-value" for="rate-slider">1.0×</output>
            </label>
            <label class="voice">
              <span id="voice-label"></span>
              <select id="voice-select"></select>
            </label>
            <span id="speech-status" class="speech-status"></span>
          </div>
          <div class="dock-group tour-group">
            <span id="tour-title" class="dock-label"></span>
            <button id="tour-prev" class="dock-btn" type="button" disabled></button>
            <button id="tour-toggle" class="dock-btn dock-btn-accent" type="button"></button>
            <button id="tour-next" class="dock-btn" type="button" disabled></button>
            <span id="tour-progress" class="tour-progress"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
