name: Deploy LLM Museum to Cloudflare Pages

# Publishes llm-museum/llm-museum-by-fable51 to Cloudflare Pages as a stand-alone site
# (https://<project>.pages.dev). Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   – an API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – the account id shown in the Cloudflare dashboard
# Until they exist the job exits early with a notice instead of failing.
# Optional repository variable CLOUDFLARE_PAGES_PROJECT overrides the project name.

on:
  push:
    branches: [main]
    paths:
      - "llm-museum/llm-museum-by-fable51/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'llm-museum' }}
    defaults:
      run:
        working-directory: llm-museum/llm-museum-by-fable51
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the Cloudflare Pages deploy."
          fi

      - name: Setup Node
        if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: llm-museum/llm-museum-by-fable51/package-lock.json

      - name: Install and build
        if: steps.creds.outputs.ok == 'true'
        run: |
          npm ci
          npm run build

      - name: Ensure the Pages project exists
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages project create "${PROJECT_NAME}" --production-branch main || true

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "${PROJECT_NAME}" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${GITHUB_SHA:0:7} via GitHub Actions"
          echo "::notice::Production URL: https://${PROJECT_NAME}.pages.dev/ (main); other branches get a preview alias."
